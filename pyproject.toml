[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sorting-algorithms-performance-analysis"
version = "1.0.0"
description = "A reproducible comparison of sorting algorithms on synthetic healthcare records."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Healthcare Sorting Benchmark contributors" }]
dependencies = [
    "matplotlib>=3.7,<4",
    "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
healthcare-sorting = "healthcare_sorting.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
